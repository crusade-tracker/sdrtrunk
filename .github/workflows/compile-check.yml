name: Compile check
on:
  push:
    branches: [ci-check]
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-package: 'jdk+fx'
          java-version: 26
      - name: Compile
        run: |
          set +e
          ./gradlew compileJava --no-daemon -q > out.txt 2>&1
          code=$?
          grep -E -A2 "\.java:[0-9]+: error" out.txt | head -60 | while IFS= read -r l; do echo "::error::$l"; done
          tail -5 out.txt
          exit $code
