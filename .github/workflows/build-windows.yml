# Builds SDR-Trunk for Windows from any point in DSheirer/sdrtrunk's history, on GitHub's servers.
# Each build is kept as its own release, so older builds are never overwritten.
# Give it a name ("Remote control", "Auto PPM fix") and that is what the release, its tag, the zip and SDR-Trunk's
# zip show. A branch build gets the next running number: "Rod build 016 - Remote control (2026-10-16)", tag
# rod-016-remote-control, and SDR-Trunk's title bar, zip and the scanner's admin page show rod-016.
# Leave the name empty for the old build-<date>-<commit> style.
#
# Run it: Actions tab -> "Build Windows (choose version)" -> Run workflow -> enter a version -> Run.
#   latest       newest code on DSheirer/sdrtrunk
#   2026-09-26   the last change made on or before that date
#   a9120ed      an exact commit id
# Or fill in "branch" to build a branch of THIS fork instead (e.g. skip-do-not-monitor); version is then ignored.
name: Build Windows (choose version)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version: latest, a date (YYYY-MM-DD) or a commit id'
        required: true
        default: 'latest'
      branch:
        description: 'Or build a branch of this fork (leave empty for the original code)'
        required: false
        default: ''
      name:
        description: 'Name for this build, e.g. Remote control (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get SDR-Trunk source from DSheirer/sdrtrunk
        env:
          WANTED: ${{ inputs.version }}
          BRANCH: ${{ inputs.branch }}
          NAME: ${{ inputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --filter=blob:none https://github.com/DSheirer/sdrtrunk.git src
          cd src
          SUFFIX=""
          if [ -n "$BRANCH" ]; then
            git fetch -q "https://github.com/${{ github.repository }}.git" "refs/heads/$BRANCH:refs/remotes/fork/$BRANCH"
            SHA=$(git rev-parse "fork/$BRANCH")
            SUFFIX="-$(echo "$BRANCH" | tr -c 'A-Za-z0-9-' '-' | sed 's/-*$//')"
          elif [ "$WANTED" = "latest" ]; then
            SHA=$(git rev-parse origin/master)
          elif [[ "$WANTED" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            SHA=$(git rev-list -1 --before="$WANTED 23:59:59 -0400" origin/master)
          else
            SHA=$(git rev-parse "$WANTED^{commit}")
          fi
          if [ -z "$SHA" ]; then echo "No version found for: $WANTED"; exit 1; fi
          git checkout -q "$SHA"
          SHORT=$(git rev-parse --short=7 "$SHA")
          CDATE=$(git log -1 --format=%cd --date=format:%Y-%m-%d "$SHA")
          JAVA=$(grep -oP 'JavaLanguageVersion\.of\(\K[0-9]+' build.gradle | head -1)
          # The exact Java build the Windows zip bundles (build.gradle's download, e.g. 27+36). The build machine must use the
          # same one - jlink refuses to mix builds, and setup-java would otherwise pick the newest update.
          JAVA_FULL=$(grep -oP 'download.bell-sw.com/java/\K[0-9.+]+' build.gradle | head -1)
          if [[ "$JAVA_FULL" =~ ^([0-9]+)\+([0-9]+)$ ]]; then JAVA_FULL="${BASH_REMATCH[1]}.0.0+${BASH_REMATCH[2]}"; fi
          TAG="build-$CDATE-$SHORT$SUFFIX"
          TITLE="SDR-Trunk $CDATE ($SHORT)$SUFFIX"
          VERSION="$CDATE-$SHORT$SUFFIX"
          if [ -n "$NAME" ]; then
            # Named build: date it was built, the day's build number, and the name.
            BDATE=$(TZ=America/New_York date +%Y-%m-%d)
            SLUG=$(echo "$NAME" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '-' | sed 's/--*/-/g; s/^-//; s/-$//' | cut -c1-40)
            WHO=$([ -n "$BRANCH" ] && echo "Rod build" || echo "SDR-Trunk")
            KIND=$( [ -n "$BRANCH" ] && echo rod || echo sdrtrunk )
            if [ "$KIND" = "rod" ]; then
              # Rod builds: one running number that never resets (rod-016, rod-017 ...), 3 digits so GitHub lists the
              # newest first. The 15 builds before this scheme used dated names, so numbering starts at 016.
              LAST=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/rod-" --jq '.[].ref' 2>/dev/null \
                     | sed -n 's#^refs/tags/rod-\([0-9][0-9][0-9]\)-.*#\1#p' | sort -n | tail -1)
              N=$((10#${LAST:-15})); [ "$N" -lt 15 ] && N=15
              N=$((N + 1))
              NUM=$(printf %03d $N)
              TAG="rod-$NUM-$SLUG"
              while gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; do N=$((N+1)); NUM=$(printf %03d $N); TAG="rod-$NUM-$SLUG"; done
              TITLE="Rod build $NUM - $NAME ($BDATE)"
              # Title bar, zip and the admin page all show rod-016
              VERSION="rod-$NUM"
            else
              # GitHub lists these releases by tag name, Z to A - so the tag carries the build number of the day right after
              # the date (sdrtrunk-2026-10-15-02-name) and the newest build always comes first.
              SAMEDAY=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/$KIND-$BDATE-" --jq length 2>/dev/null || echo 0)
              N=$((SAMEDAY + 1))
              TAG="$KIND-$BDATE-$(printf %02d $N)-$SLUG"
              while gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; do N=$((N+1)); TAG="$KIND-$BDATE-$(printf %02d $N)-$SLUG"; done
              TITLE="$WHO $BDATE - $NAME"
              VERSION="$BDATE-build"
              if [ "$N" -gt 1 ]; then VERSION="$VERSION-$N"; fi
            fi
          fi
          {
            echo "SHA=$SHA"
            echo "SHORT=$SHORT"
            echo "CDATE=$CDATE"
            echo "JAVA=${JAVA:-26}"
            echo "JAVA_FULL=${JAVA_FULL:-${JAVA:-26}}"
            echo "TAG=$TAG"
            echo "TITLE=$TITLE"
            echo "VERSION=$VERSION"
            echo "SUFFIX=$SUFFIX"
            echo "BASE=$(git merge-base "$SHA" origin/master | cut -c1-7)"
          } >> "$GITHUB_ENV"
          echo "Building $SHORT from $CDATE: $(git log -1 --format=%s "$SHA")"

      - name: Set up Java ${{ env.JAVA }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_FULL }}
          distribution: 'liberica'
          java-package: 'jdk+fx'

      - name: Build Windows release
        working-directory: src
        run: ./gradlew runtimeZipWindows -PprojectVersion=${{ env.VERSION }}

      - name: Write release notes
        working-directory: src
        env:
          NAME: ${{ inputs.name }}
        run: |
          {
            if [ -n "$NAME" ]; then
              echo "## $NAME"
              echo
            fi
            if [ -n "$SUFFIX" ]; then
              echo "SDR-Trunk built from branch **${{ inputs.branch }}** of this fork (commit ${SHORT}), based on DSheirer/sdrtrunk commit ${BASE}."
              echo
              echo "Changes on this branch:"
              echo
              git log --format='- %s' "${BASE}..${SHA}"
              echo
            else
              echo "SDR-Trunk built from DSheirer/sdrtrunk commit [${SHORT}](https://github.com/DSheirer/sdrtrunk/commit/${SHA}), last change ${CDATE}."
            fi
            echo
            echo "Changes in this build (newest first, back to v0.6.1):"
            echo
            git log --format='- %cd %s' --date=short v0.6.1.."$SHA" 2>/dev/null | head -120 || true
          } > ../release-notes.md
          ls -la build/image/

      - name: Save as its own release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # The tag points at the commit that was built, so each release shows its own commit date.
          target_commitish: ${{ inputs.branch != '' && env.SHA || github.sha }}
          name: ${{ env.TITLE }}
          body_path: release-notes.md
          prerelease: true
          files: src/build/image/*windows-x86_64*.zip
